name: Update AI Blocklist

on:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run updater
        run: python scripts/update.py

      - name: Regenerate telemetry-blocklist.lsrules
        run: |
          python3 - << 'PYEOF'
          import json, urllib.request
          from datetime import datetime, timezone
          url = "https://csdznwrk.github.io/telemetry-blocklist-plus/domains.txt"
          with urllib.request.urlopen(url) as r:
              domains = [l.strip() for l in r.read().decode().splitlines() if l.strip() and not l.startswith('#')]
          rules = [{"action": "deny", "process": "any", "remote-domains": d, "notes": "telemetry-blocklist-plus", "disabled": False} for d in domains]
          lsrules = {"name": "Telemetry + Malware Blocklist", "description": f"{len(domains)} domains. Updated {datetime.now(timezone.utc).strftime('%Y-%m-%d')}.", "rules": rules}
          with open('docs/telemetry-blocklist.lsrules', 'w') as f:
              json.dump(lsrules, f, indent=2)
          print(f"Written {len(rules)} rules")
          PYEOF

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet docs/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "blocklist-bot"
          git config user.email "blocklist-bot@users.noreply.github.com"
          DOMAIN_COUNT=$(python -c "import json; print(json.load(open('docs/metadata.json'))['domain_count'])")
          git add docs/
          git commit -m "chore: auto-update blocklist — ${DOMAIN_COUNT} domains [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

  # Publish docs/ to GitHub Pages after every successful update
  deploy-pages:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # pick up any commits from the update job

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
